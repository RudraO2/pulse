  Invoice:
    - name: currency
      TYPE: STRING
      REQUIRED: true
      comment: Three-letter ISO 4217 [currency](/bots/payments#supported-currencies) code
    - name: description
      TYPE: STRING
      REQUIRED: true
      comment: Product description
    - name: start_parameter
      TYPE: STRING
      REQUIRED: true
      comment: Unique bot deep-linking parameter that can be used to generate this invoice
    - name: title
      TYPE: STRING
      REQUIRED: true
      comment: Product name
    - name: total_amount
      TYPE: INT
      REQUIRED: true
      comment: Total price in the *smallest units* of the currency (integer, **not** float/double). For example, for a price of `US$ 1.45` pass `amount = 145`. See the *exp* parameter in [currencies.json](https://core.telegram.org/bots/payments/currencies.json), it shows the number of digits past the decimal point for each currency (2 for the majority of currencies).
  LabeledPrice:
    - name: amount
      TYPE: INT
      REQUIRED: true
      comment: Price of the product in the *smallest units* of the [currency](/bots/payments#supported-currencies) (integer, **not** float/double). For example, for a price of `US$ 1.45` pass `amount = 145`. See the *exp* parameter in [currencies.json](https://core.telegram.org/bots/payments/currencies.json), it shows the number of digits past the decimal point for each currency (2 for the majority of currencies).
    - name: label
      TYPE: STRING
      REQUIRED: true
      comment: Portion label
  Location:
    - name: heading
      TYPE: INT
      REQUIRED: false
      comment: "*Optional*. The direction in which user is moving, in degrees; 1-360. For active live locations only."
    - name: horizontal_accuracy
      TYPE: FLOAT
      REQUIRED: false
      comment: "*Optional*. The radius of uncertainty for the location, measured in meters; 0-1500"
    - name: latitude
      TYPE: FLOAT
      REQUIRED: true
      comment: Latitude as defined by sender
    - name: live_period
      TYPE: INT
      REQUIRED: false
      comment: "*Optional*. Time relative to the message sending date, during which the location can be updated, in seconds. For active live locations only."
    - name: longitude
      TYPE: FLOAT
      REQUIRED: true
      comment: Longitude as defined by sender
    - name: proximity_alert_radius
      TYPE: INT
      REQUIRED: false
      comment: "*Optional*. Maximum distance for proximity alerts about approaching another chat member, in meters. For sent live locations only."
  MaskPosition:
    - name: point
      TYPE: STRING
      REQUIRED: true
      ENUM:
        - forehead
        - eyes
        - mouth
        - chin
      comment: The part of the face relative to which the mask should be placed. One of “forehead”, “eyes”, “mouth”, or “chin”.
    - name: scale
      TYPE: FLOAT
      REQUIRED: true
      comment: Mask scaling coefficient. For example, 2.0 means double size.
    - name: x_shift
      TYPE: FLOAT
      REQUIRED: true
      comment: Shift by X-axis measured in widths of the mask scaled to the face size, from left to right. For example, choosing -1.0 will place mask just to the left of the default mask position.
    - name: y_shift
      TYPE: FLOAT
      REQUIRED: true
      comment: Shift by Y-axis measured in heights of the mask scaled to the face size, from top to bottom. For example, 1.0 will place the mask just below the default mask position.
