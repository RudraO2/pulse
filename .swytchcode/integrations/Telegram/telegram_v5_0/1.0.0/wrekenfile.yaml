  telegram_v5_0.unbanchatmember.create:
    SUMMARY: Use this method to unban a previously kicked user in a supergroup or channel
    DESC: Use this method to unban a previously kicked user in a supergroup or channel. The user will **not** return to the group or channel automatically, but will be able to join via link, etc. The bot must be an administrator for this to work. By default, this method guarantees that after the call the user is not a member of the chat, but will be able to join it. So if the user is a member of the chat they will also be **removed** from the chat. If you don't want this, use the parameter *only\_if\_banned*. Returns *True* on success.
    HTTP:
      METHOD: POST
      ENDPOINT: /unbanChatMember
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(post_unbanChatMember_784066b1_post_unbanChatMember_cfdeb280Request)
