STRUCTS:
  Animation:
    - name: duration
      TYPE: INT
      REQUIRED: true
      comment: Duration of the video in seconds as defined by sender
    - name: file_id
      TYPE: STRING
      REQUIRED: true
      comment: Identifier for this file, which can be used to download or reuse the file
    - name: file_name
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Original animation filename as defined by sender"
    - name: file_size
      TYPE: INT
      REQUIRED: false
      comment: "*Optional*. File size"
    - name: file_unique_id
      TYPE: STRING
      REQUIRED: true
      comment: Unique identifier for this file, which is supposed to be the same over time and for different bots. Can't be used to download or reuse the file.
    - name: height
      TYPE: INT
      REQUIRED: true
      comment: Video height as defined by sender
    - name: mime_type
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. MIME type of the file as defined by sender"
    - name: thumb
      TYPE: STRUCT(PhotoSize)
      REQUIRED: false
    - name: width
      TYPE: INT
      REQUIRED: true
      comment: Video width as defined by sender
  Audio:
    - name: duration
      TYPE: INT
      REQUIRED: true
      comment: Duration of the audio in seconds as defined by sender
    - name: file_id
      TYPE: STRING
      REQUIRED: true
      comment: Identifier for this file, which can be used to download or reuse the file
    - name: file_name
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Original filename as defined by sender"
    - name: file_size
      TYPE: INT
      REQUIRED: false
      comment: "*Optional*. File size"
    - name: file_unique_id
      TYPE: STRING
      REQUIRED: true
      comment: Unique identifier for this file, which is supposed to be the same over time and for different bots. Can't be used to download or reuse the file.
    - name: mime_type
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. MIME type of the file as defined by sender"
    - name: performer
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Performer of the audio as defined by sender or by audio tags"
    - name: thumb
      TYPE: STRUCT(PhotoSize)
      REQUIRED: false
    - name: title
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Title of the audio as defined by sender or by audio tags"
  BotCommand:
    - name: command
      TYPE: STRING
      REQUIRED: true
      comment: Text of the command, 1-32 characters. Can contain only lowercase English letters, digits and underscores.
    - name: description
      TYPE: STRING
      REQUIRED: true
      comment: Description of the command, 3-256 characters.
  CallbackQuery:
    - name: chat_instance
      TYPE: STRING
      REQUIRED: true
      comment: Global identifier, uniquely corresponding to the chat to which the message with the callback button was sent. Useful for high scores in [games](https://core.telegram.org/bots/api/#games).
    - name: data
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Data associated with the callback button. Be aware that a bad client can send arbitrary data in this field."
    - name: from
      TYPE: STRUCT(User)
      REQUIRED: true
    - name: game_short_name
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Short name of a [Game](https://core.telegram.org/bots/api/#games) to be returned, serves as the unique identifier for the game"
    - name: id
      TYPE: STRING
      REQUIRED: true
      comment: Unique identifier for this query
    - name: inline_message_id
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Identifier of the message sent via the bot in inline mode, that originated the query."
    - name: message
      TYPE: STRUCT(Message)
      REQUIRED: false
  Chat:
    - name: bio
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Bio of the other party in a private chat. Returned only in [getChat](https://core.telegram.org/bots/api/#getchat)."
    - name: can_set_sticker_set
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. True, if the bot can change the group sticker set. Returned only in [getChat](https://core.telegram.org/bots/api/#getchat)."
    - name: description
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Description, for groups, supergroups and channel chats. Returned only in [getChat](https://core.telegram.org/bots/api/#getchat)."
    - name: first_name
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. First name of the other party in a private chat"
    - name: id
      TYPE: INT
      REQUIRED: true
      comment: Unique identifier for this chat. This number may be greater than 32 bits and some programming languages may have difficulty/silent defects in interpreting it. But it is smaller than 52 bits, so a signed 64 bit integer or double-precision float type are safe for storing this identifier.
    - name: invite_link
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Chat invite link, for groups, supergroups and channel chats. Each administrator in a chat generates their own invite links, so the bot must first generate the link using [exportChatInviteLink](https://core.telegram.org/bots/api/#exportchatinvitelink). Returned only in [getChat](https://core.telegram.org/bots/api/#getchat)."
    - name: last_name
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Last name of the other party in a private chat"
    - name: linked_chat_id
      TYPE: INT
      REQUIRED: false
      comment: "*Optional*. Unique identifier for the linked chat, i.e. the discussion group identifier for a channel and vice versa; for supergroups and channel chats. This identifier may be greater than 32 bits and some programming languages may have difficulty/silent defects in interpreting it. But it is smaller than 52 bits, so a signed 64 bit integer or double-precision float type are safe for storing this identifier. Returned only in [getChat](https://core.telegram.org/bots/api/#getchat)."
    - name: location
      TYPE: STRUCT(ChatLocation)
      REQUIRED: false
    - name: permissions
      TYPE: STRUCT(ChatPermissions)
      REQUIRED: false
    - name: photo
      TYPE: STRUCT(ChatPhoto)
      REQUIRED: false
    - name: pinned_message
      TYPE: STRUCT(Message)
      REQUIRED: false
    - name: slow_mode_delay
      TYPE: INT
      REQUIRED: false
      comment: "*Optional*. For supergroups, the minimum allowed delay between consecutive messages sent by each unpriviledged user. Returned only in [getChat](https://core.telegram.org/bots/api/#getchat)."
    - name: sticker_set_name
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. For supergroups, name of group sticker set. Returned only in [getChat](https://core.telegram.org/bots/api/#getchat)."
    - name: title
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Title, for supergroups, channels and group chats"
    - name: type
      TYPE: STRING
      REQUIRED: true
      ENUM:
        - private
        - group
        - supergroup
        - channel
      comment: Type of chat, can be either “private”, “group”, “supergroup” or “channel”
    - name: username
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Username, for private chats, supergroups and channels if available"
  ChatLocation:
    - name: address
      TYPE: STRING
      REQUIRED: true
      comment: Location address; 1-64 characters, as defined by the chat owner
    - name: location
      TYPE: STRUCT(Location)
      REQUIRED: true
  ChatMember:
    - name: can_add_web_page_previews
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. Restricted only. True, if the user is allowed to add web page previews to their messages"
    - name: can_be_edited
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. Administrators only. True, if the bot is allowed to edit administrator privileges of that user"
    - name: can_change_info
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. Administrators and restricted only. True, if the user is allowed to change the chat title, photo and other settings"
    - name: can_delete_messages
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. Administrators only. True, if the administrator can delete messages of other users"
    - name: can_edit_messages
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. Administrators only. True, if the administrator can edit messages of other users and can pin messages; channels only"
    - name: can_invite_users
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. Administrators and restricted only. True, if the user is allowed to invite new users to the chat"
    - name: can_pin_messages
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. Administrators and restricted only. True, if the user is allowed to pin messages; groups and supergroups only"
    - name: can_post_messages
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. Administrators only. True, if the administrator can post in the channel; channels only"
    - name: can_promote_members
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. Administrators only. True, if the administrator can add new administrators with a subset of their own privileges or demote administrators that he has promoted, directly or indirectly (promoted by administrators that were appointed by the user)"
    - name: can_restrict_members
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. Administrators only. True, if the administrator can restrict, ban or unban chat members"
    - name: can_send_media_messages
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. Restricted only. True, if the user is allowed to send audios, documents, photos, videos, video notes and voice notes"
    - name: can_send_messages
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. Restricted only. True, if the user is allowed to send text messages, contacts, locations and venues"
    - name: can_send_other_messages
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. Restricted only. True, if the user is allowed to send animations, games, stickers and use inline bots"
    - name: can_send_polls
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. Restricted only. True, if the user is allowed to send polls"
    - name: custom_title
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Owner and administrators only. Custom title for this user"
    - name: is_anonymous
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. Owner and administrators only. True, if the user's presence in the chat is hidden"
    - name: is_member
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. Restricted only. True, if the user is a member of the chat at the moment of the request"
    - name: status
      TYPE: STRING
      REQUIRED: true
      ENUM:
        - creator
        - administrator
        - member
        - restricted
        - left
        - kicked
      comment: The member's status in the chat. Can be “creator”, “administrator”, “member”, “restricted”, “left” or “kicked”
    - name: until_date
      TYPE: INT
      REQUIRED: false
      comment: "*Optional*. Restricted and kicked only. Date when restrictions will be lifted for this user; unix time"
    - name: user
      TYPE: STRUCT(User)
      REQUIRED: true
  ChatPermissions:
    - name: can_add_web_page_previews
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. True, if the user is allowed to add web page previews to their messages, implies can\\_send\\_media\\_messages"
    - name: can_change_info
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. True, if the user is allowed to change the chat title, photo and other settings. Ignored in public supergroups"
    - name: can_invite_users
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. True, if the user is allowed to invite new users to the chat"
    - name: can_pin_messages
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. True, if the user is allowed to pin messages. Ignored in public supergroups"
    - name: can_send_media_messages
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. True, if the user is allowed to send audios, documents, photos, videos, video notes and voice notes, implies can\\_send\\_messages"
    - name: can_send_messages
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. True, if the user is allowed to send text messages, contacts, locations and venues"
    - name: can_send_other_messages
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. True, if the user is allowed to send animations, games, stickers and use inline bots, implies can\\_send\\_media\\_messages"
    - name: can_send_polls
      TYPE: BOOL
      REQUIRED: false
      comment: "*Optional*. True, if the user is allowed to send polls, implies can\\_send\\_messages"
  ChatPhoto:
    - name: big_file_id
      TYPE: STRING
      REQUIRED: true
      comment: File identifier of big (640x640) chat photo. This file\_id can be used only for photo download and only for as long as the photo is not changed.
    - name: big_file_unique_id
      TYPE: STRING
      REQUIRED: true
      comment: Unique file identifier of big (640x640) chat photo, which is supposed to be the same over time and for different bots. Can't be used to download or reuse the file.
    - name: small_file_id
      TYPE: STRING
      REQUIRED: true
      comment: File identifier of small (160x160) chat photo. This file\_id can be used only for photo download and only for as long as the photo is not changed.
    - name: small_file_unique_id
      TYPE: STRING
      REQUIRED: true
      comment: Unique file identifier of small (160x160) chat photo, which is supposed to be the same over time and for different bots. Can't be used to download or reuse the file.
  ChosenInlineResult:
    - name: from
      TYPE: STRUCT(User)
      REQUIRED: true
    - name: inline_message_id
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Identifier of the sent inline message. Available only if there is an [inline keyboard](https://core.telegram.org/bots/api/#inlinekeyboardmarkup) attached to the message. Will be also received in [callback queries](https://core.telegram.org/bots/api/#callbackquery) and can be used to [edit](https://core.telegram.org/bots/api/#updating-messages) the message."
    - name: location
      TYPE: STRUCT(Location)
      REQUIRED: false
    - name: query
      TYPE: STRING
      REQUIRED: true
      comment: The query that was used to obtain the result
    - name: result_id
      TYPE: STRING
      REQUIRED: true
      comment: The unique identifier for the result that was chosen
  Contact:
    - name: first_name
      TYPE: STRING
      REQUIRED: true
      comment: Contact's first name
    - name: last_name
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Contact's last name"
    - name: phone_number
      TYPE: STRING
      REQUIRED: true
      comment: Contact's phone number
    - name: user_id
      TYPE: INT
      REQUIRED: false
      comment: "*Optional*. Contact's user identifier in Telegram"
    - name: vcard
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Additional data about the contact in the form of a [vCard](https://en.wikipedia.org/wiki/VCard)"
  Dice:
    - name: emoji
      TYPE: STRING
      REQUIRED: true
      comment: Emoji on which the dice throw animation is based
    - name: value
      TYPE: INT
      REQUIRED: true
      comment: Value of the dice, 1-6 for “<img alt="🎲" src="//telegram.org/img/emoji/40/F09F8EB2.png" height="20" width="20" />” and “<img alt="🎯" src="//telegram.org/img/emoji/40/F09F8EAF.png" height="20" width="20" />” base emoji, 1-5 for “<img alt="🏀" src="//telegram.org/img/emoji/40/F09F8F80.png" height="20" width="20" />” and “<img alt="⚽" src="//telegram.org/img/emoji/40/E29ABD.png" height="20" width="20" />” base emoji, 1-64 for “<img alt="🎰" src="//telegram.org/img/emoji/40/F09F8EB0.png" height="20" width="20" />” base emoji
  Document:
    - name: file_id
      TYPE: STRING
      REQUIRED: true
      comment: Identifier for this file, which can be used to download or reuse the file
    - name: file_name
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Original filename as defined by sender"
    - name: file_size
      TYPE: INT
      REQUIRED: false
      comment: "*Optional*. File size"
    - name: file_unique_id
      TYPE: STRING
      REQUIRED: true
      comment: Unique identifier for this file, which is supposed to be the same over time and for different bots. Can't be used to download or reuse the file.
    - name: mime_type
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. MIME type of the file as defined by sender"
    - name: thumb
      TYPE: STRUCT(PhotoSize)
      REQUIRED: false
  EncryptedCredentials:
    - name: data
      TYPE: STRING
      REQUIRED: true
      comment: Base64-encoded encrypted JSON-serialized data with unique user's payload, data hashes and secrets required for [EncryptedPassportElement](https://core.telegram.org/bots/api/#encryptedpassportelement) decryption and authentication
    - name: hash
      TYPE: STRING
      REQUIRED: true
      comment: Base64-encoded data hash for data authentication
    - name: secret
      TYPE: STRING
      REQUIRED: true
      comment: Base64-encoded secret, encrypted with the bot's public RSA key, required for data decryption
  EncryptedPassportElement:
    - name: data
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Base64-encoded encrypted Telegram Passport element data provided by the user, available for “personal\\_details”, “passport”, “driver\\_license”, “identity\\_card”, “internal\\_passport” and “address” types. Can be decrypted and verified using the accompanying [EncryptedCredentials](https://core.telegram.org/bots/api/#encryptedcredentials)."
    - name: email
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. User's verified email address, available only for “email” type"
    - name: files
      TYPE: "[]STRUCT(PassportFile)"
      REQUIRED: false
      comment: "*Optional*. Array of encrypted files with documents provided by the user, available for “utility\\_bill”, “bank\\_statement”, “rental\\_agreement”, “passport\\_registration” and “temporary\\_registration” types. Files can be decrypted and verified using the accompanying [EncryptedCredentials](https://core.telegram.org/bots/api/#encryptedcredentials)."
    - name: front_side
      TYPE: STRUCT(PassportFile)
      REQUIRED: false
    - name: hash
      TYPE: STRING
      REQUIRED: true
      comment: Base64-encoded element hash for using in [PassportElementErrorUnspecified](https://core.telegram.org/bots/api/#passportelementerrorunspecified)
    - name: phone_number
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. User's verified phone number, available only for “phone\\_number” type"
    - name: reverse_side
      TYPE: STRUCT(PassportFile)
      REQUIRED: false
    - name: selfie
      TYPE: STRUCT(PassportFile)
      REQUIRED: false
    - name: translation
      TYPE: "[]STRUCT(PassportFile)"
      REQUIRED: false
      comment: "*Optional*. Array of encrypted files with translated versions of documents provided by the user. Available if requested for “passport”, “driver\\_license”, “identity\\_card”, “internal\\_passport”, “utility\\_bill”, “bank\\_statement”, “rental\\_agreement”, “passport\\_registration” and “temporary\\_registration” types. Files can be decrypted and verified using the accompanying [EncryptedCredentials](https://core.telegram.org/bots/api/#encryptedcredentials)."
    - name: type
      TYPE: STRING
      REQUIRED: true
      ENUM:
        - personal_details
        - passport
        - driver_license
        - identity_card
        - internal_passport
        - address
        - utility_bill
        - bank_statement
        - rental_agreement
        - passport_registration
        - temporary_registration
        - phone_number
        - email
      comment: Element type. One of “personal\_details”, “passport”, “driver\_license”, “identity\_card”, “internal\_passport”, “address”, “utility\_bill”, “bank\_statement”, “rental\_agreement”, “passport\_registration”, “temporary\_registration”, “phone\_number”, “email”.
