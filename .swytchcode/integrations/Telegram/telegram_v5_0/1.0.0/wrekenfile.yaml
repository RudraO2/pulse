  telegram_v5_0.deletemessage.create:
    SUMMARY: |-
      Use this method to delete a message, including service messages, with the following limitations:
      \- A message can only be deleted if it was sent less than 48 hours ago
    DESC: |-
      Use this method to delete a message, including service messages, with the following limitations:
      \- A message can only be deleted if it was sent less than 48 hours ago.
      \- A dice message in a private chat can only be deleted if it was sent more than 24 hours ago.
      \- Bots can delete outgoing messages in private chats, groups, and supergroups.
      \- Bots can delete incoming messages in private chats.
      \- Bots granted *can\_post\_messages* permissions can delete outgoing messages in channels.
      \- If the bot is an administrator of a group, it can delete any message there.
      \- If the bot has *can\_delete\_messages* permission in a supergroup or a channel, it can delete any message there.
      Returns *True* on success.
    HTTP:
      METHOD: POST
      ENDPOINT: /deleteMessage
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(post_deleteMessage_b28c03fd_post_deleteMessage_3337100cRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(post_deleteMessage_b28c03fd_post_deleteMessage_3337100cRequest)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(post_deleteMessage_b28c03fd_post_deleteMessage_3337100cResponse200)
        RETURNVAR: telegram_v5_0_deletemessage_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: HTTP default
    CANONICAL_ID: telegram_v5_0.deletemessage.create
