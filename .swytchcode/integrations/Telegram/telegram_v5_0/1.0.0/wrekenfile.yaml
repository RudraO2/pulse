    - name: google_place_id
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Google Places identifier of the venue"
    - name: google_place_type
      TYPE: STRING
      REQUIRED: false
      comment: "*Optional*. Google Places type of the venue. (See [supported types](https://developers.google.com/places/web-service/supported_types).)"
    - name: latitude
      TYPE: FLOAT
      REQUIRED: true
      comment: Latitude of the venue in degrees
    - name: longitude
      TYPE: FLOAT
      REQUIRED: true
      comment: Longitude of the venue in degrees
    - name: title
      TYPE: STRING
      REQUIRED: true
