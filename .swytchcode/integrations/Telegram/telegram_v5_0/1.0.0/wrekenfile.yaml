VERSION: 2.0.2
DEFAULTS:
  w_base_url: https://api.telegram.org/bot{token}
METHODS:
  telegram_v5_0.addstickertoset.create:
    SUMMARY: Use this method to add a new sticker to a set created by the bot
    DESC: Use this method to add a new sticker to a set created by the bot. You **must** use exactly one of the fields *png\_sticker* or *tgs\_sticker*. Animated stickers can be added to animated sticker sets and only to them. Animated sticker sets can have up to 50 stickers. Static sticker sets can have up to 120 stickers. Returns *True* on success.
    HTTP:
      METHOD: POST
      ENDPOINT: /addStickerToSet
      HEADERS:
        Content-Type: multipart/form-data
      CONTENT_TYPE: multipart/form-data
      ACCEPT: application/json
      BODYTYPE: form-data
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - emojis:
          TYPE: STRING
          REQUIRED: true
          LOCATION: body
      - mask_position:
          TYPE: STRUCT(MaskPosition)
          REQUIRED: false
          LOCATION: body
      - name:
          TYPE: STRING
          REQUIRED: true
          LOCATION: body
      - png_sticker:
          TYPE: STRUCT(post_addStickerToSet_d7ecf992_post_addStickerToSet_2f8b4561Request_png_sticker)
          REQUIRED: false
          LOCATION: body
      - tgs_sticker:
          TYPE: ANY
          REQUIRED: false
          LOCATION: body
      - user_id:
          TYPE: INT
          REQUIRED: true
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(post_addStickerToSet_d7ecf992_post_addStickerToSet_2f8b4561Response200)
        RETURNVAR: telegram_v5_0_addstickertoset_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: HTTP default
    CANONICAL_ID: telegram_v5_0.addstickertoset.create
  telegram_v5_0.answercallbackquery.create:
    SUMMARY: Use this method to send answers to callback queries sent from [inline keyboards](/bots#inline-keyboards-and-on-the-fly-updating)
    DESC: |-
      Use this method to send answers to callback queries sent from [inline keyboards](/bots#inline-keyboards-and-on-the-fly-updating). The answer will be displayed to the user as a notification at the top of the chat screen or as an alert. On success, *True* is returned.

      Alternatively, the user can be redirected to the specified Game URL. For this option to work, you must first create a game for your bot via [@Botfather](https://t.me/botfather) and accept the terms. Otherwise, you may use links like `t.me/your_bot?start=XXXX` that open your bot with a parameter.
    HTTP:
      METHOD: POST
      ENDPOINT: /answerCallbackQuery
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(post_answerCallbackQuery_bbc77f18_post_answerCallbackQuery_e351a67Request)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(post_answerCallbackQuery_bbc77f18_post_answerCallbackQuery_e351a67Request)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(post_answerCallbackQuery_bbc77f18_post_answerCallbackQuery_e351a67Response200)
        RETURNVAR: telegram_v5_0_answercallbackquery_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(Error)
        STATUS: 500
        WHEN: HTTP default
    CANONICAL_ID: telegram_v5_0.answercallbackquery.create
